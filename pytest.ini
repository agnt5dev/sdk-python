[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Exclude archived tests from collection
norecursedirs = tests/archive tests/archive/*

# Asyncio mode
asyncio_mode = auto

# Integration test markers
markers =
    integration: Integration tests that require platform services
    unit: Unit tests that run in isolation
    embedded: Tests specific to embedded mode (dev-server with SQLite)
    postgres: Tests specific to postgres mode (community edition)
    managed: Tests specific to managed mode (Redpanda + CockroachDB)
    slow: Tests that take longer than 5 seconds

# Coverage options
addopts =
    --cov=agnt5
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --strict-markers
    -v

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */examples/*
    */__pycache__/*
    */rust-src/*
    */target/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
