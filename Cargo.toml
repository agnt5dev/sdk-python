[package]
name = "agnt5-sdk-python"
version = "0.9.8"
edition = "2021"
authors = ["AGNT5 Team"]

[lib]
name = "agnt5_sdk_python"
crate-type = ["cdylib"]
path = "rust-src/lib.rs"

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Shared AGNT5 runtime foundation
agnt5-sdk-core = "0.1.6"

# Base64 decoding and JSON handling
base64 = "0.22"
serde = "1.0"
serde_json = "1.0"

# Async stream utilities
futures = "0.3"

# Logging integration
log = "0.4"

# OpenTelemetry for baggage support
opentelemetry = "0.30"
tracing = "0.1"
tracing-opentelemetry = "0.31"

# Error handling
anyhow = "1.0"

# Hex decoding for trace_id/span_id
hex = "0.4"

# UUID generation
uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = ["wasm-sandbox", "libsql-memory"]
libsql-memory = ["agnt5-sdk-core/libsql-memory"]
wasm-sandbox = ["agnt5-sdk-core/wasm-sandbox"]

[build-dependencies]
pyo3-build-config = "0.27"
