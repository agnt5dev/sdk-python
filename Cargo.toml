[package]
name = "agnt5-sdk-python"
version = "0.2.8-alpha.2"
edition = "2021"
authors = ["AGNT5 Team"]

[lib]
name = "agnt5_sdk_python"
crate-type = ["cdylib"]
path = "rust-src/lib.rs"

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.27", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Local dependencies
agnt5-sdk-core = { path = "../sdk-core" }

# Base64 decoding and JSON handling
base64 = "0.22"
serde = "1.0"
serde_json = "1.0"

# Async stream utilities
futures = "0.3"

# Logging integration
# TODO: Re-enable pyo3-log once it supports pyo3 0.27
# pyo3-log = "0.13"
log = "0.4"

# OpenTelemetry for baggage support
opentelemetry = "0.30"
tracing = "0.1"

# Error handling
anyhow = "1.0"

[build-dependencies]
pyo3-build-config = "0.27"
