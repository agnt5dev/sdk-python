name: SDK Python CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental compiles, and nothing in CI reads
  # debug info. Both settings make the dev build smaller and cacheable.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  validate-pr:
    name: Validate pull request
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.98-

      - name: Configure compiler cache backend
        # The GitHub Actions cache is scoped per branch, so every pull request
        # starts cold. A Cloudflare R2 bucket (S3-compatible) is shared across
        # all branches. Fall back to the Actions cache when the bucket is not
        # configured, for example on pull requests from forks.
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            {
              echo "SCCACHE_BUCKET=$R2_BUCKET"
              echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              echo "SCCACHE_REGION=auto"
              echo "SCCACHE_S3_KEY_PREFIX=sdk-python/${RUNNER_OS}-${RUNNER_ARCH}"
              echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            } >> "$GITHUB_ENV"
            echo "Compiler cache: R2 bucket $R2_BUCKET"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Compiler cache: GitHub Actions cache (R2 not configured)"
          fi

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure build parallelism
        run: echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || echo 4)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      - name: Build development extension
        run: uv run maturin develop --locked

      - name: Lint
        run: uv run ruff check src

      - name: Run unit tests
        # The golden fixture lives in the sibling sdk-core repository, which is
        # not present in this standalone checkout.
        run: >-
          uv run pytest tests/unit -q
          --ignore=tests/unit/test_eval_goldens.py

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
