name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: agnt5dev/sdk-core
          path: sdk-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Use sibling sdk-core checkout
        run: |
          mkdir -p .cargo
          printf '[patch.crates-io]\nagnt5-sdk-core = { path = "sdk-core" }\n' > .cargo/config.toml
      - working-directory: sdk-python
        run: uv sync --all-groups
      - working-directory: sdk-python
        run: uv run ruff check src tests
      - working-directory: sdk-python
        run: uv run pytest tests/unit -q
      - working-directory: sdk-python
        run: uv build --sdist
