name: SDK Python Release

# Runs only when a GitHub release is published. There is intentionally no
# manual trigger: cut a release (or prerelease) from the GitHub UI or `gh
# release create` and this workflow builds and publishes the matching version.
# Pull request validation lives in ci.yml.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and changelog
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PACKAGE_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*version = "\(.*\)"/\1/')

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "Release tag must be a stable or PEP 440 prerelease version: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#v}
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing ## [$RELEASE_VERSION]" >&2
            exit 1
          fi
          if printf '%s\n' "$PACKAGE_VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
            if [ "$RELEASE_PRERELEASE" != true ]; then
              echo "Prerelease package $PACKAGE_VERSION requires a GitHub prerelease" >&2
              exit 1
            fi
          elif [ "$RELEASE_PRERELEASE" = true ]; then
            echo "Stable package $PACKAGE_VERSION cannot be published from a GitHub prerelease" >&2
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  build-wheels-linux:
    name: Linux Wheel manylinux_2_28 (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Build portable wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_28"
          container: ${{ matrix.container }}
          args: --release --locked --compatibility pypi --out dist
          sccache: true

      - name: Verify Linux wheel tag
        run: test -n "$(find dist -maxdepth 1 -name '*manylinux_2_28*.whl' -print -quit)"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./dist/*.whl
          retention-days: 7

  verify-vercel-wheel:
    name: Verify Vercel wheel compatibility
    needs: build-wheels-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download x86_64 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x64
          path: dist/

      - name: Install on a manylinux_2_34 baseline
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            quay.io/pypa/manylinux_2_34_x86_64:latest \
            bash -lc '/opt/python/cp311-cp311/bin/python -m pip install --no-index --no-deps --find-links=/dist agnt5'

  build-sdist:
    name: Source distribution
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          container: "off"
          args: --out dist

      - name: Verify source distribution
        run: test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: ./dist/*.tar.gz
          retention-days: 7

  build-wheels-macos:
    name: macOS Wheels
    needs: validate-release
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.98-

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure build parallelism
        run: echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)" >> "$GITHUB_ENV"

      - name: Show sccache stats (before)
        run: sccache --show-stats || true

      - name: Build ARM64 wheel
        working-directory: .
        run: |
          uv run --with maturin \
            maturin build \
            --release \
            --locked \
            --target aarch64-apple-darwin \
            --out dist

      - name: Show sccache stats (after)
        run: sccache --show-stats

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: ./dist/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - validate-release
      - build-wheels-linux
      - verify-vercel-wheel
      - build-wheels-macos
      - build-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: |
          echo "=== Built distributions ==="
          ls -lh dist/
          echo ""
          echo "Expected 3 wheels (Linux x86_64, Linux ARM64, and macOS ARM64) and 1 sdist"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Output release summary
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`agnt5\` (PyPI)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wheels" >> $GITHUB_STEP_SUMMARY
          for wheel in dist/*.whl; do
            echo "- \`$(basename "$wheel")\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "### Source distribution" >> $GITHUB_STEP_SUMMARY
          for archive in dist/*.tar.gz; do
            echo "- \`$(basename "$archive")\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Post to Slack channel
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && '✓' || '✗' }} agnt5-sdk-python:${{ needs.validate-release.outputs.version }}${{ job.status != 'success' && format(' - {0}', job.status) || '' }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
