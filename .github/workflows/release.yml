name: SDK Python Release

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip-publish:
        description: "Skip PyPI publish"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and changelog
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SKIP_PUBLISH: ${{ inputs.skip-publish }}
        run: |
          PACKAGE_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*version = "\(.*\)"/\1/')

          if [ "$EVENT_NAME" = release ]; then
            if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release tag must be vX.Y.Z: $RELEASE_TAG" >&2
              exit 1
            fi
            RELEASE_VERSION=${RELEASE_TAG#v}
            if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
              exit 1
            fi
            if ! grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md; then
              echo "CHANGELOG.md is missing ## [$RELEASE_VERSION]" >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SKIP_PUBLISH" != true ]; then
            test "${GITHUB_REF_NAME}" = main
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  build-wheels-linux:
    name: Linux Wheel (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
            runner: ubuntu-latest
            sccache-target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            sccache-target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Rust toolchain
        run: |
          # Check if rustup exists, install if not
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            # Source cargo env for current shell
            source "$HOME/.cargo/env"
          else
            # Update to latest stable if rustup exists
            rustup update stable
            rustup default stable
          fi
          rustup target add ${{ matrix.target }}
          # Make cargo available in subsequent steps
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install sccache
        run: |
          # Check if sccache exists, install if not
          if ! command -v sccache &> /dev/null; then
            echo "Installing sccache..."
            SCCACHE_VERSION="0.8.2"
            curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-${{ matrix.sccache-target }}.tar.gz" -o /tmp/sccache.tar.gz
            tar xzf /tmp/sccache.tar.gz -C /tmp
            mkdir -p "$HOME/.local/bin"
            mv "/tmp/sccache-v${SCCACHE_VERSION}-${{ matrix.sccache-target }}/sccache" "$HOME/.local/bin/"
            rm -rf /tmp/sccache*
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "sccache already installed: $(sccache --version)"
          fi

      - name: Configure build caches
        run: |
          # Set up cache directories
          CACHE_BASE="${HOME}/.cache/agnt5-build"
          mkdir -p "${CACHE_BASE}/cargo"
          mkdir -p "${CACHE_BASE}/uv"
          mkdir -p "${CACHE_BASE}/sccache"

          echo "CARGO_HOME=${CACHE_BASE}/cargo" >> $GITHUB_ENV
          echo "UV_CACHE_DIR=${CACHE_BASE}/uv" >> $GITHUB_ENV
          echo "SCCACHE_DIR=${CACHE_BASE}/sccache" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

          # Optimize build parallelism
          echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || echo 4)" >> $GITHUB_ENV

      - name: Validate cargo cache
        run: |
          # Detect and remove corrupted cargo cache entries
          CARGO_REGISTRY="${HOME}/.cache/agnt5-build/cargo/registry"
          if [ -d "$CARGO_REGISTRY" ]; then
            echo "Validating cargo cache..."
            # Try to read all Cargo.toml files in the cache
            find "$CARGO_REGISTRY/src" -name "Cargo.toml" -type f 2>/dev/null | while read -r file; do
              if ! head -1 "$file" >/dev/null 2>&1; then
                echo "Found corrupted cache entry: $file"
                # Remove the entire crate directory
                CRATE_DIR=$(dirname "$file")
                echo "Removing corrupted crate: $CRATE_DIR"
                rm -rf "$CRATE_DIR"
              fi
            done
            echo "Cache validation complete"
          fi

      - name: Show sccache stats (before)
        run: sccache --show-stats || true

      - name: Build wheel
        working-directory: .
        run: |
          ~/.local/bin/uv run --with maturin \
            maturin build \
            --release \
            --target ${{ matrix.target }} \
            --out dist

      - name: Show sccache stats (after)
        run: sccache --show-stats

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: ./dist/*.whl
          retention-days: 7

  build-wheels-macos:
    name: macOS Wheels
    needs: validate-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Rust toolchain
        run: |
          # Check if rustup exists, install if not
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            # Source cargo env for current shell
            source "$HOME/.cargo/env"
          else
            # Update to latest stable if rustup exists
            rustup update stable
            rustup default stable
          fi
          rustup target add aarch64-apple-darwin
          # Make cargo available in subsequent steps
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install sccache
        run: |
          # Check if sccache exists, install if not
          if ! command -v sccache &> /dev/null; then
            echo "Installing sccache..."
            SCCACHE_VERSION="0.8.2"
            curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz" -o /tmp/sccache.tar.gz
            tar xzf /tmp/sccache.tar.gz -C /tmp
            mkdir -p "$HOME/.local/bin"
            mv "/tmp/sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin/sccache" "$HOME/.local/bin/"
            rm -rf /tmp/sccache*
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "sccache already installed: $(sccache --version)"
          fi

      - name: Configure build caches
        run: |
          # Set up cache directories
          CACHE_BASE="${HOME}/.cache/agnt5-build"
          mkdir -p "${CACHE_BASE}/cargo"
          mkdir -p "${CACHE_BASE}/uv"
          mkdir -p "${CACHE_BASE}/sccache"

          echo "CARGO_HOME=${CACHE_BASE}/cargo" >> $GITHUB_ENV
          echo "UV_CACHE_DIR=${CACHE_BASE}/uv" >> $GITHUB_ENV
          echo "SCCACHE_DIR=${CACHE_BASE}/sccache" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

          # Optimize build parallelism (macOS uses sysctl)
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)" >> $GITHUB_ENV

      - name: Validate cargo cache
        run: |
          # Detect and remove corrupted cargo cache entries
          CARGO_REGISTRY="${HOME}/.cache/agnt5-build/cargo/registry"
          if [ -d "$CARGO_REGISTRY" ]; then
            echo "Validating cargo cache..."
            # Try to read all Cargo.toml files in the cache
            find "$CARGO_REGISTRY/src" -name "Cargo.toml" -type f 2>/dev/null | while read -r file; do
              if ! head -1 "$file" >/dev/null 2>&1; then
                echo "Found corrupted cache entry: $file"
                # Remove the entire crate directory
                CRATE_DIR=$(dirname "$file")
                echo "Removing corrupted crate: $CRATE_DIR"
                rm -rf "$CRATE_DIR"
              fi
            done
            echo "Cache validation complete"
          fi

      - name: Show sccache stats (before)
        run: sccache --show-stats || true

      - name: Build ARM64 wheel
        working-directory: .
        run: |
          ~/.local/bin/uv run --with maturin \
            maturin build \
            --release \
            --target aarch64-apple-darwin \
            --out dist

      - name: Show sccache stats (after)
        run: sccache --show-stats

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: ./dist/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [validate-release, build-wheels-linux, build-wheels-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.skip-publish != true)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF_NAME}" = main

      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: |
          echo "=== Built wheels ==="
          ls -lh dist/
          echo ""
          echo "Expected 3 wheels (x86_64-linux, aarch64-linux, aarch64-darwin)"

      - name: Get SDK version
        id: version
        run: |
          VERSION=${{ needs.validate-release.outputs.version }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi
          git config user.name "agnt5-release-bot"
          git config user.email "release-bot@agnt5.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Output release summary
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`agnt5\` (PyPI)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wheels" >> $GITHUB_STEP_SUMMARY
          for wheel in dist/*.whl; do
            echo "- \`$(basename "$wheel")\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Post to Slack channel
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && '✓' || '✗' }} agnt5-sdk-python:${{ steps.version.outputs.version }}${{ job.status != 'success' && format(' - {0}', job.status) || '' }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
